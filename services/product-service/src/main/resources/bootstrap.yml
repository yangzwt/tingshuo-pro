spring:
  application:
    name: tingshuo-product # 应用名称，是Nacos配置Data ID的核心组成部分
  cloud:
    nacos:
      server-addr: 192.168.6.41:8848
      username: nacos
      password: Aa123456_
      namespace: tingshuo-pro # 命名空间
      group: DEFAULT_GROUP
      # 服务发现配置
      discovery:
        enabled: true # 开启服务注册与发现
        namespace: ${spring.cloud.nacos.namespace}
      # 配置中心配置
      config:
        file-extension: yaml # 配置文件格式
        timeout: 5000 # 配置源超时时间(毫秒)
        refresh-enabled: true # 开启动态刷新
        # 共享配置文件列表
        shared-configs:
          - data-id: common-config.yaml
            group: DEFAULT_GROUP
            refresh: true
        # 扩展配置文件列表（优先级高于共享配置）
        extension-configs:
          - data-id: gateway-config.yaml
            group: DEFAULT_GROUP
            refresh: true
        namespace: ${spring.cloud.nacos.namespace}

seata:
  enable: true
  registry:
    type: nacos
    nacos:
      server-addr: ${spring.cloud.nacos.server-addr}
      namespace: ${spring.cloud.nacos.namespace}
      group: DEFAULT_GROUP
      username: ${spring.cloud.nacos.username}
      password: ${spring.cloud.nacos.password}
      application: seata-server # Seata Server在Nacos中的服务名
  application-id: ${spring.application.name} # 使用应用名
  tx-service-group: my_tx_group # 事务组名称，需与Seata服务器配置对应
  config:
    type: nacos
    nacos:
      server-addr: ${spring.cloud.nacos.server-addr}
      namespace: ${spring.cloud.nacos.namespace}
      group: SEATA_GROUP
      username: ${spring.cloud.nacos.username}
      password: ${spring.cloud.nacos.password}
  service:
    vgroup_mapping:
      my_tx_group: default  # 映射关系
