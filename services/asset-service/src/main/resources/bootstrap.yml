spring:
  application:
    # 应用名称
    name: tingshuo-asset
  cloud:
    # nacos 配置中心和服务发现配置
    nacos:
      # nacos 配置
      server-addr: 192.168.6.41:8848
      username: nacos
      password: Aa123456_
      namespace: tingshuo-pro
      discovery:
        # 是否启用服务注册
        enabled: true
        # 服务命名空间
        namespace: tingshuo-pro
      config:
        server-addr: 192.168.6.41:8848
        username: nacos
        password: Aa123456_
        # 配置文件命名空间
        namespace: tingshuo-pro
        # 配置文件后缀格式
        file-extension: yaml
        # 配置源超时时间毫秒
        timeout: 5000
        # 是否开启动态刷新
        refresh-enabled: true
        # 共享配置文件列表
        shared-configs:
          - data-id: common-config.yaml
            # 配置文件组
            group: DEFAULT_GROUP
            # 是否动态刷新
            refresh: true
        # 扩展配置文件列表, 优先级高于共享配置文件
        extension-configs:
          - data-id: gateway-config.yaml
            group: DEFAULT_GROUP
            refresh: true
      aliaba:
        seata:
          tx-service-group: my_test_tx_group
seata:
  registry:
    type: nacos
    nacos:
      server-addr: 192.168.6.41:8848
      namespace: tingshuo-pro
      group: SEATA_GROUP
      username: nacos
      password: Aa123456_
  config:
    type: nacos
    nacos:
      server-addr: 192.168.6.41:8848
      group: SEATA_GROUP
      namespace: tingshuo-pro
      username: nacos
      password: Aa123456_
  tx-service-group: my_tx_group
  service:
    vgroup-mapping:
      my_tx_group: default





