spring:
  application:
    name: tingshuo-coupon # 应用名称，是Nacos配置Data ID的核心组成部分
  cloud:
    nacos:
      server-addr: 192.168.6.41:8848
      username: nacos
      password: Aa123456_
      namespace: tingshuo-pro # 命名空间
      group: DEFAULT_GROUP
      # 服务发现配置
      discovery:
        enabled: true # 开启服务注册与发现
        namespace: ${spring.cloud.nacos.namespace}
        # 可根据需要添加服务发现优化参数，如：
        # heart-beat-interval: 30000
        # heart-beat-timeout: 90000
      # 配置中心配置
      config:
        file-extension: yaml # 配置文件格式
        timeout: 5000 # 配置源超时时间(毫秒)
        refresh-enabled: true # 开启动态刷新
        # 共享配置文件列表
        shared-configs:
          - data-id: common-config.yaml
            group: DEFAULT_GROUP
            refresh: true
        # 扩展配置文件列表（优先级高于共享配置）
        extension-configs:
          - data-id: gateway-config.yaml
            group: DEFAULT_GROUP
            refresh: true
        namespace: ${spring.cloud.nacos.namespace}