spring:
  application:
    # 应用名称
    name: tingshuo-user
  cloud:
    # nacos 配置中心和服务发现配置
    nacos:
      # nacos 配置
      server-addr: 192.168.6.41:8848
      username: nacos
      password: Aa123456_
      namespace: tingshuo-pro
      discovery:
        # 是否启用服务注册
        enabled: true
        # 服务命名空间
        namespace: tingshuo-pro
      config:
        server-addr: 192.168.6.41:8848
        username: nacos
        password: Aa123456_
        # 配置文件命名空间
        namespace: tingshuo-pro
        # 配置文件后缀格式
        file-extension: yaml
        # 配置源超时时间毫秒
        timeout: 5000
        # 是否开启动态刷新
        refresh-enabled: true
        # 共享配置文件列表
        shared-configs:
          - data-id: common-config.yaml
            # 配置文件组
            group: DEFAULT_GROUP
            # 是否动态刷新
            refresh: true
        # 扩展配置文件列表, 优先级高于共享配置文件
        extension-configs:
          - data-id: gateway-config.yaml
            group: DEFAULT_GROUP
            refresh: true
seata:
  enable: true
  registry:
    type: nacos
    nacos:
      server-addr: ${spring.cloud.nacos.server-addr}
      namespace: ${spring.cloud.nacos.namespace}
      group: DEFAULT_GROUP
      username: ${spring.cloud.nacos.username}
      password: ${spring.cloud.nacos.password}
      application: seata-server # Seata Server在Nacos中的服务名
  application-id: ${spring.application.name} # 使用应用名
  tx-service-group: my_tx_group # 事务组名称，需与Seata服务器配置对应
  config:
    type: nacos
    nacos:
      server-addr: ${spring.cloud.nacos.server-addr}
      namespace: ${spring.cloud.nacos.namespace}
      group: SEATA_GROUP
      username: ${spring.cloud.nacos.username}
      password: ${spring.cloud.nacos.password}
  service:
    vgroup_mapping:
      my_tx_group: default  # 映射关系

