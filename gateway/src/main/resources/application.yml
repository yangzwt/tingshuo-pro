server:
  port: 18080 # 服务端口
# spring cloud gateway 配置
spring:
  cloud:
    gateway:
      routes: # 路由配置
        # ========== 用户服务 ==========
        - id: tingshuo-user-route # 用户路由id
          uri: lb://tingshuo-user # 用户服务地址
          predicates:
            - Path=/user/** # 路径匹配
        - id: tingshuo-asset-route # 资产服务地址路由id
          uri: lb://tingshuo-asset # 资产服务地址
          predicates:
              - Path=/deposit/** # 匹配路径
        # ========== 订单服务 ==========
        - id: tingshuo-order-route
          uri: lb://tingshuo-order
          predicates:
              - Path=/order/**
        # ========== 库存服务 ==========
        - id: tingshuo-storage-route
          uri: lb://tingshuo-storage
          predicates:
              - Path=/storage/**

        # ========== 商品服务 ==========
        - id: tingshuo-product-route
          uri: lb://tingshuo-product
          predicates:
              - Path=/product/**



    # sentinel 限流配置
    sentinel:
      transport:
        dashboard: 192.168.6.41:19080 # sentinel 控制台地址
        port: 8719 # sentinel 端口
      datasource:
        ds1: # sentinel 配置
          nacos:
            server-addr: 192.168.6.41:8848
            username: nacos
            password: Aa123456_
            namespace: tingshuo-pro
            group-id: DEFAULT_GROUP
            data-id: gateway-flow-rules # 配置文件名称
            data-type: json #  配置文件类型
            rule-type: gw-flow # 网关限流规则